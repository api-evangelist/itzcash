name: Itzcash
description: >-
  Itzcash (ItzCash Card Ltd, operated by Ebix Payment Services Private Limited,
  CIN U74999MH2006PTC160835, Mumbai) was one of India's early prepaid payment and
  digital-payments companies, offering prepaid/gift cards, utility and bill payments,
  domestic money transfer, insurance and travel payments, and an agent-assisted retail
  payment network across India. The company was acquired by Ebix, Inc. in 2017 and folded
  into the EbixCash financial-exchange business. The ItzCash brand has since been retired:
  www.itzcash.com now redirects to ebixcash.com, and there is no first-party ItzCash
  developer portal, public API, or OpenAPI definition. This profile was surfaced as a
  Lightspeed Venture Partners portfolio company and is retained as a historical company
  record in the API Evangelist network. Any live API surface belongs to the parent EbixCash
  entity (an "Ebixcash API Hub" root responds at api.ebixcash.com), not to the ItzCash brand.
